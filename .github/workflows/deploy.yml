name: 검증 후 배포

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: 문제 은행 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # problems.js 는 generate.js 가 만드는 파일이다.
      # 커밋된 것과 방금 만든 것이 다르면 누군가 생성물을 직접 고쳤다는 뜻.
      - name: 문제 은행 재생성
        run: node generate.js
      - name: 커밋된 problems.js 가 최신인지
        run: git diff --exit-code problems.js

      - name: 전 문항 수치 검증
        run: node verify.js
      - name: 채점 엔진 회귀 테스트
        run: node grade-test.js

      # sw.js 는 저장소에 두지 않고 배포할 때 만든다.
      # 실제로 올라가는 바이트로 해시를 내야 캐시 버전이 정확해지고,
      # 커밋본과 재생성본을 바이트 비교하던 예전 방식처럼
      # 체크아웃 차이에 걸려 넘어지지 않는다.
      - name: 서비스 워커 생성
        run: node build-sw.js

      - name: 배포용 디렉터리 꾸리기
        run: |
          mkdir -p _site
          cp index.html styles.css app.js parser.js problems.js sw.js \
             manifest.webmanifest CNAME _site/
          cp -r icons vendor _site/
          echo "--- 배포 파일 목록"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  apk:
    name: 안드로이드 APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 태그를 밀면 릴리스에 APK 를 붙인다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 비밀값에 키스토어가 있으면 그걸로 서명하고, 없으면 디버그 키로 서명한다.
      # 어느 쪽이든 기기에 바로 설치되는 APK 가 나온다.
      - name: 서명 키 준비
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "키스토어로 서명합니다"
          else
            echo "키스토어가 없어 디버그 키로 서명합니다 (설치는 문제없음)"
          fi

      - name: APK 빌드
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: 결과물 이름 정리
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
             "dist/daily-integral-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

      # 태그(v1.2.3 …)를 밀면 릴리스 페이지에 붙여 바로 내려받게 한다
      - name: 릴리스에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber

  deploy:
    name: GitHub Pages 배포
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
